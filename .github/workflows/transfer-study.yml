name: Replay held-out calibration study
on: workflow_dispatch
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r examples/clock-study/requirements.txt
      - run: python examples/clock-study/fetch_transfer.py "$RUNNER_TEMP/study"
      - name: Replay measured sessions and labeled controls
        run: |
          root="$RUNNER_TEMP/study"
          python examples/clock-study/replay_transfer.py "$root/original" "$root/halo" "$root/dds" > transfer-results.json
      - name: Check the published alarms, coverage and errors
        run: |
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "examples/clock-study")
          from reproduce import equivalent
          measured = json.loads(Path("transfer-results.json").read_text())
          expected = json.loads(Path("examples/clock-study/transfer-results.json").read_text())
          if not equivalent(measured, expected):
              raise SystemExit("Measured transfer results differ from the release")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: transfer-results
          path: transfer-results.json
