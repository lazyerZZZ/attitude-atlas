name: Test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify public site assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for asset in index.html app.mjs frames.mjs scene.mjs style.css sample.csv; do
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              "${SITE_URL%/}/$asset?revision=$GITHUB_SHA" -o "$RUNNER_TEMP/live-asset"
            cmp "site/$asset" "$RUNNER_TEMP/live-asset"
          done
