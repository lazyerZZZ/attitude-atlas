name: Test and publish
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs
      - name: Exercise the workbenches in Chrome
        run: |
          npm install --prefix "$RUNNER_TEMP/atlas-browser" --no-audit --no-fund playwright-core@1.62.1
          python3 -m http.server 8000 --bind 127.0.0.1 --directory site > "$RUNNER_TEMP/atlas-http.log" 2>&1 &
          trap 'kill "$!" 2>/dev/null || true' EXIT
          curl --silent --fail --retry 10 --retry-connrefused http://127.0.0.1:8000/ > /dev/null
          NODE_PATH="$RUNNER_TEMP/atlas-browser/node_modules" CHROME_BIN="$(command -v google-chrome)" node tests/browser/workbench.cjs
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
      - name: Verify public site assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          shopt -s globstar nullglob
          for path in site/**/*; do
            [[ -f "$path" ]] || continue
            asset="${path#site/}"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              "${SITE_URL%/}/$asset?revision=$GITHUB_SHA" -o "$RUNNER_TEMP/live-asset"
            cmp "site/$asset" "$RUNNER_TEMP/live-asset"
          done
